name: Build and publish textbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          packages: |
            any::tidyverse
            any::palmerpenguins
            any::ggthemes
            any::nycflights13
            any::knitr
            any::rmarkdown
      - name: Render complete book
        run: quarto render
      # The R checks also verify files exported while rendering the chapters.
      - name: Check R calculations
        run: Rscript --vanilla quarto/_verification/check-r.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check HTML and interactions
        run: node quarto/_verification/check-html.cjs
      - name: Upload published book
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
